<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live English, Talk English</title>
    
    <!-- ETIQUETAS PWA (APP NATIVA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f9fafb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Live English">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/1e3a8a/ffffff?text=LE">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        body { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    
    <!-- VISTA 1: LIBRERÍA -->
    <main id="library-view" class="p-4 md:p-8 md:max-w-6xl mx-auto transition-opacity duration-300 pb-12">
        <header class="mb-6 md:mb-10 pt-4 text-center md:text-left">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight">
                <span class="text-blue-900">Live English,</span><br/>
                <span class="text-red-800">Talk English</span>
            </h1>
            <p class="text-gray-500 mt-3 font-medium text-sm md:text-base">Select a book to play its pop songs</p>
        </header>

        <!-- BOTÓN DE INSTALACIÓN INTELIGENTE -->
        <div id="install-container" class="hidden flex justify-center md:justify-start mb-8">
            <button id="install-button" class="flex items-center text-sm md:text-base font-bold bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-full shadow-lg transition-transform active:scale-95">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Instalar App
            </button>
        </div>
        
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8">
            <!-- Tarjeta: BASIC -->
            <div onclick="playBook('https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mmontero-608517442/sets/basic-beats')" 
                 class="group bg-white hover:shadow-xl hover:-translate-y-1 p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 transition-all duration-300 cursor-pointer relative">
                <div class="relative mb-3 md:mb-4 overflow-hidden rounded-xl aspect-[3/4] bg-gray-100">
                    <img src="cover-basic.jpg" alt="Basic Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <h2 class="font-bold text-gray-900 mb-1 truncate text-sm md:text-lg">Basic Level</h2>
                <p class="text-xs text-gray-500 truncate font-medium">Pop Songs</p>
            </div>

            <!-- Tarjeta: INTERMEDIATE (ACTUALIZADA) -->
            <div onclick="playBook('https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mmontero-608517442/sets/english-pop-sessions')" 
                 class="group bg-white hover:shadow-xl hover:-translate-y-1 p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 transition-all duration-300 cursor-pointer relative">
                <div class="relative mb-3 md:mb-4 overflow-hidden rounded-xl aspect-[3/4] bg-gray-100">
                    <img src="cover-intermediate.jpg" alt="Intermediate Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <h2 class="font-bold text-gray-900 mb-1 truncate text-sm md:text-lg">Intermediate Level</h2>
                <p class="text-xs text-gray-500 truncate font-medium">Pop Songs</p>
            </div>

            <!-- Tarjeta: ADVANCED -->
            <div onclick="playBook('URL_EMBED_ADVANCED')" 
                 class="group bg-white hover:shadow-xl hover:-translate-y-1 p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 transition-all duration-300 cursor-pointer relative">
                <div class="relative mb-3 md:mb-4 overflow-hidden rounded-xl aspect-[3/4] bg-gray-100">
                    <img src="cover-advanced.jpg" alt="Advanced Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <h2 class="font-bold text-gray-900 mb-1 truncate text-sm md:text-lg">Advanced Level</h2>
                <p class="text-xs text-gray-500 truncate font-medium">Pop Songs</p>
            </div>

            <!-- Tarjeta: EXPERT -->
            <div onclick="playBook('URL_EMBED_EXPERT')" 
                 class="group bg-white hover:shadow-xl hover:-translate-y-1 p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 transition-all duration-300 cursor-pointer relative">
                <div class="relative mb-3 md:mb-4 overflow-hidden rounded-xl aspect-[3/4] bg-gray-100">
                    <img src="cover-expert.jpg" alt="Expert Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <h2 class="font-bold text-gray-900 mb-1 truncate text-sm md:text-lg">Expert Level</h2>
                <p class="text-xs text-gray-500 truncate font-medium">Pop Songs</p>
            </div>
        </div>
    </main>

    <!-- VISTA 2: REPRODUCTOR -->
    <div id="player-view" class="hidden fixed inset-0 z-50 bg-[#f9fafb] flex flex-col h-[100dvh]">
        <div class="flex-1 relative w-full bg-white">
            <div id="soundcloud-container" class="absolute inset-0"></div>
        </div>
        
        <div class="p-4 pb-8 md:pb-6 bg-white/60 backdrop-blur-2xl border-t border-white/50 flex flex-col items-center shadow-[0_-10px_30px_rgba(0,0,0,0.04)] relative z-10">
            <div class="w-full max-w-md flex flex-col gap-2">
                <div class="flex justify-between gap-2">
                    <button onclick="playBook('https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mmontero-608517442/sets/basic-beats')" class="flex-1 text-gray-700 font-semibold text-[11px] md:text-sm bg-white/70 hover:bg-white border border-white transition-all py-2.5 rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-95">Basic</button>
                    <!-- BOTÓN MINI INTERMEDIATE (ACTUALIZADO) -->
                    <button onclick="playBook('https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mmontero-608517442/sets/english-pop-sessions')" class="flex-1 text-gray-700 font-semibold text-[11px] md:text-sm bg-white/70 hover:bg-white border border-white transition-all py-2.5 rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-95">Inter</button>
                    <button onclick="playBook('URL_EMBED_ADVANCED')" class="flex-1 text-gray-700 font-semibold text-[11px] md:text-sm bg-white/70 hover:bg-white border border-white transition-all py-2.5 rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-95">Adv</button>
                    <button onclick="playBook('URL_EMBED_EXPERT')" class="flex-1 text-gray-700 font-semibold text-[11px] md:text-sm bg-white/70 hover:bg-white border border-white transition-all py-2.5 rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-95">Expert</button>
                </div>
                <button onclick="goBack()" class="group flex items-center justify-center text-gray-700 font-bold text-sm md:text-base bg-white/70 hover:bg-white border border-white transition-all px-6 py-3 rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-95 w-full mt-1">
                    <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-gray-700 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Volver al menú
                </button>
            </div>
        </div>
    </div>

    <script>
        // Registro del Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('Service Worker Registrado');
            });
        }

        // Lógica del Botón de Instalación
        let deferredPrompt;
        const installContainer = document.getElementById('install-container');
        const installButton = document.getElementById('install-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installContainer.classList.remove('hidden');
        });

        installButton.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installContainer.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installContainer.classList.add('hidden');
        });

        // Lógica del Reproductor
        function playBook(soundCloudUrl) {
            document.getElementById('library-view').classList.add('hidden');
            document.getElementById('player-view').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            document.getElementById('soundcloud-container').innerHTML = `
                <iframe width="100%" height="100%" scrolling="yes" frameborder="no" allow="autoplay" 
                src="${soundCloudUrl}&color=%23000000&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
                </iframe>
            `;
            window.scrollTo(0, 0);
        }

        function goBack() {
            document.getElementById('player-view').classList.add('hidden');
            document.getElementById('library-view').classList.remove('hidden');
            document.body.style.overflow = '';
            document.getElementById('soundcloud-container').innerHTML = '';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
