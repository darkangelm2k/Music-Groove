<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northway Pop Songs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex font-sans overflow-hidden">
    
    <!-- Área Principal de Contenido -->
    <main class="flex-1 overflow-y-auto relative w-full">
        
        <!-- ========================================== -->
        <!-- VISTA 1: LIBRERÍA (GRID BLANCO)            -->
        <!-- ========================================== -->
        <div id="library-view" class="p-4 md:p-8 md:max-w-6xl mx-auto transition-opacity duration-300">
            <header class="mb-8 md:mb-12 pt-4">
                <h1 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight">Northway Program</h1>
                <p class="text-gray-500 mt-2 font-medium">Select a book to play its pop songs</p>
            </header>
            
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8">
                
                <!-- Tarjeta: BASIC -->
                <div onclick="playBook('https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mmontero-608517442/sets/basic-beats', 'Basic Level')" 
                     class="group bg-white hover:shadow-xl hover:-translate-y-1 p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 transition-all duration-300 cursor-pointer relative">
                    <div class="relative mb-3 md:mb-4 overflow-hidden rounded-xl aspect-[3/4] bg-gray-100">
                        <img src="https://placehold.co/300x400/2563eb/ffffff?text=Basic" alt="Basic Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                    <h2 class="font-bold text-gray-900 mb-1 truncate text-sm md:text-lg">Basic Level</h2>
                    <p class="text-xs md:text-sm text-gray-500 truncate font-medium">Pop Songs</p>
                </div>

                <!-- Tarjeta: INTERMEDIATE -->
                <div onclick="playBook('URL_EMBED_INTERMEDIATE', 'Intermediate Level')" 
                     class="group bg-white hover:shadow-xl hover:-translate-y-1 p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 transition-all duration-300 cursor-pointer relative">
                    <div class="relative mb-3 md:mb-4 overflow-hidden rounded-xl aspect-[3/4] bg-gray-100">
                        <img src="https://placehold.co/300x400/10b981/ffffff?text=Intermediate" alt="Intermediate Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                    <h2 class="font-bold text-gray-900 mb-1 truncate text-sm md:text-lg">Intermediate Level</h2>
                    <p class="text-xs md:text-sm text-gray-500 truncate font-medium">Pop Songs</p>
                </div>

                <!-- Tarjeta: ADVANCED -->
                <div onclick="playBook('URL_EMBED_ADVANCED', 'Advanced Level')" 
                     class="group bg-white hover:shadow-xl hover:-translate-y-1 p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 transition-all duration-300 cursor-pointer relative">
                    <div class="relative mb-3 md:mb-4 overflow-hidden rounded-xl aspect-[3/4] bg-gray-100">
                        <img src="https://placehold.co/300x400/f59e0b/ffffff?text=Advanced" alt="Advanced Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                    <h2 class="font-bold text-gray-900 mb-1 truncate text-sm md:text-lg">Advanced Level</h2>
                    <p class="text-xs md:text-sm text-gray-500 truncate font-medium">Pop Songs</p>
                </div>

                <!-- Tarjeta: EXPERT -->
                <div onclick="playBook('URL_EMBED_EXPERT', 'Expert Level')" 
                     class="group bg-white hover:shadow-xl hover:-translate-y-1 p-3 md:p-4 rounded-2xl shadow-sm border border-gray-100 transition-all duration-300 cursor-pointer relative">
                    <div class="relative mb-3 md:mb-4 overflow-hidden rounded-xl aspect-[3/4] bg-gray-100">
                        <img src="https://placehold.co/300x400/ef4444/ffffff?text=Expert" alt="Expert Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                    <h2 class="font-bold text-gray-900 mb-1 truncate text-sm md:text-lg">Expert Level</h2>
                    <p class="text-xs md:text-sm text-gray-500 truncate font-medium">Pop Songs</p>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 2: REPRODUCTOR (BLANCO Y LIMPIO)     -->
        <!-- ========================================== -->
        <div id="player-view" class="hidden flex-col h-full bg-white md:bg-gray-50 md:p-8 absolute inset-0 z-50">
            
            <!-- Barra Superior del Reproductor -->
            <div class="p-4 md:px-0 flex items-center bg-white md:bg-transparent border-b border-gray-100 md:border-none sticky top-0 z-10">
                <button onclick="goBack()" class="flex items-center text-gray-600 hover:text-black transition-colors font-semibold text-sm md:text-base bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-full">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Books
                </button>
                <h2 class="ml-4 font-bold text-lg truncate text-gray-900" id="player-title">Now Playing</h2>
            </div>

            <!-- Contenedor del Reproductor SoundCloud -->
            <!-- Al quitar bg-black y usar el alto completo, el widget blanco de SC encaja perfecto -->
            <div class="flex-1 w-full bg-white md:rounded-2xl md:shadow-lg overflow-hidden border-t md:border border-gray-100">
                <div id="soundcloud-container" class="w-full h-full">
                    <!-- El iframe se cargará dinámicamente aquí -->
                </div>
            </div>
        </div>

    </main>

    <script>
        function playBook(soundCloudUrl, title) {
            document.getElementById('library-view').classList.add('hidden');
            document.getElementById('player-view').classList.remove('hidden');
            document.getElementById('player-title').innerText = title;
            
            // LA MAGIA OCURRE AQUÍ: 
            // visual=false genera el diseño blanco y en formato lista.
            // color=%23000000 pinta los botones de play de color negro en lugar del naranja por defecto.
            document.getElementById('soundcloud-container').innerHTML = `
                <iframe width="100%" height="100%" style="min-height: 80vh;" scrolling="no" frameborder="no" allow="autoplay" 
                src="${soundCloudUrl}&color=%23000000&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
                </iframe>
            `;
            
            window.scrollTo(0, 0);
        }

        function goBack() {
            document.getElementById('player-view').classList.add('hidden');
            document.getElementById('library-view').classList.remove('hidden');
            
            // Apaga la música al volver
            document.getElementById('soundcloud-container').innerHTML = '';
            
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
