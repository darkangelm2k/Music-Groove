<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Playlists</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            base: '#121212',
                            card: '#181818',
                            hover: '#282828',
                            green: '#1ed760',
                            light: '#b3b3b3'
                        }
                    },
                    boxShadow: {
                        'spotify-drop': '0 8px 24px rgba(0,0,0,0.5)'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #888; }
    </style>
</head>
<body class="bg-black text-white h-screen flex font-sans overflow-hidden">
    
    <!-- Barra Lateral (Desktop) - Oculta en móviles -->
    <nav class="hidden md:flex w-64 bg-spotify-base rounded-lg flex-col p-4 m-2 mr-0">
        <div class="flex items-center gap-4 mb-8 text-white hover:text-spotify-light transition-colors cursor-pointer">
            <svg class="w-7 h-7 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33z"/></svg>
            <span class="font-bold text-lg">Home</span>
        </div>
        <div class="flex items-center gap-4 text-spotify-light hover:text-white transition-colors cursor-pointer">
            <svg class="w-7 h-7 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span class="font-bold text-lg">Search</span>
        </div>
    </nav>

    <!-- Área Principal de Contenido -->
    <main class="flex-1 bg-spotify-base md:rounded-lg overflow-y-auto bg-gradient-to-b from-[#2a2a2a] to-spotify-base relative w-full m-0 md:m-2">
        
        <!-- ========================================== -->
        <!-- VISTA 1: LIBRERÍA (GRID DE LIBROS)         -->
        <!-- ========================================== -->
        <div id="library-view" class="p-4 md:p-8 transition-opacity duration-300">
            <h1 class="text-2xl md:text-3xl font-bold mb-6 text-white tracking-tight">Pop Songs Program</h1>
            
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Tarjeta: BASIC -->
                <div onclick="playBook('https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mmontero-608517442/sets/basic-beats', 'Basic Level')" 
                     class="group bg-spotify-card hover:bg-spotify-hover p-3 md:p-4 rounded-md transition duration-300 cursor-pointer relative">
                    <div class="relative mb-3 md:mb-4 overflow-hidden rounded shadow-spotify-drop aspect-[3/4]">
                        <img src="https://placehold.co/300x400/1ed760/000000?text=Basic" alt="Basic Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute bottom-2 right-2 opacity-0 translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 ease-out">
                            <button class="w-10 h-10 md:w-12 md:h-12 bg-spotify-green rounded-full flex items-center justify-center text-black shadow-xl">
                                <svg class="w-5 h-5 md:w-6 md:h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>
                    </div>
                    <h2 class="font-bold text-white mb-1 truncate text-sm md:text-base">Basic Level</h2>
                    <p class="text-xs md:text-sm text-spotify-light truncate">Pop Songs Program</p>
                </div>

                <!-- Tarjeta: INTERMEDIATE -->
                <div onclick="playBook('URL_EMBED_INTERMEDIATE', 'Intermediate Level')" 
                     class="group bg-spotify-card hover:bg-spotify-hover p-3 md:p-4 rounded-md transition duration-300 cursor-pointer relative">
                    <div class="relative mb-3 md:mb-4 overflow-hidden rounded shadow-spotify-drop aspect-[3/4]">
                        <img src="https://placehold.co/300x400/3b82f6/ffffff?text=Intermediate" alt="Intermediate Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute bottom-2 right-2 opacity-0 translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 ease-out">
                            <button class="w-10 h-10 md:w-12 md:h-12 bg-spotify-green rounded-full flex items-center justify-center text-black shadow-xl">
                                <svg class="w-5 h-5 md:w-6 md:h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>
                    </div>
                    <h2 class="font-bold text-white mb-1 truncate text-sm md:text-base">Intermediate Level</h2>
                    <p class="text-xs md:text-sm text-spotify-light truncate">Pop Songs Program</p>
                </div>

                <!-- Tarjeta: ADVANCED -->
                <div onclick="playBook('URL_EMBED_ADVANCED', 'Advanced Level')" 
                     class="group bg-spotify-card hover:bg-spotify-hover p-3 md:p-4 rounded-md transition duration-300 cursor-pointer relative">
                    <div class="relative mb-3 md:mb-4 overflow-hidden rounded shadow-spotify-drop aspect-[3/4]">
                        <img src="https://placehold.co/300x400/ef4444/ffffff?text=Advanced" alt="Advanced Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute bottom-2 right-2 opacity-0 translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 ease-out">
                            <button class="w-10 h-10 md:w-12 md:h-12 bg-spotify-green rounded-full flex items-center justify-center text-black shadow-xl">
                                <svg class="w-5 h-5 md:w-6 md:h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>
                    </div>
                    <h2 class="font-bold text-white mb-1 truncate text-sm md:text-base">Advanced Level</h2>
                    <p class="text-xs md:text-sm text-spotify-light truncate">Pop Songs Program</p>
                </div>

                <!-- Tarjeta: EXPERT -->
                <div onclick="playBook('URL_EMBED_EXPERT', 'Expert Level')" 
                     class="group bg-spotify-card hover:bg-spotify-hover p-3 md:p-4 rounded-md transition duration-300 cursor-pointer relative">
                    <div class="relative mb-3 md:mb-4 overflow-hidden rounded shadow-spotify-drop aspect-[3/4]">
                        <img src="https://placehold.co/300x400/8b5cf6/ffffff?text=Expert" alt="Expert Book Cover" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute bottom-2 right-2 opacity-0 translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 ease-out">
                            <button class="w-10 h-10 md:w-12 md:h-12 bg-spotify-green rounded-full flex items-center justify-center text-black shadow-xl">
                                <svg class="w-5 h-5 md:w-6 md:h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>
                    </div>
                    <h2 class="font-bold text-white mb-1 truncate text-sm md:text-base">Expert Level</h2>
                    <p class="text-xs md:text-sm text-spotify-light truncate">Pop Songs Program</p>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VISTA 2: REPRODUCTOR (PANTALLA COMPLETA)   -->
        <!-- ========================================== -->
        <div id="player-view" class="hidden p-0 md:p-8 flex flex-col h-full bg-spotify-base">
            
            <!-- Barra Superior del Reproductor -->
            <div class="p-4 flex items-center bg-[#181818] md:bg-transparent md:mb-4 sticky top-0 z-10 shadow-md md:shadow-none">
                <button onclick="goBack()" class="flex items-center text-white hover:text-spotify-green transition-colors font-bold text-sm md:text-base bg-[#282828] md:bg-spotify-card px-4 py-2 rounded-full shadow-lg">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Volver a los libros
                </button>
                <h2 class="ml-4 font-bold text-lg truncate md:text-2xl" id="player-title">Now Playing</h2>
            </div>

            <!-- Contenedor del Reproductor SoundCloud -->
            <div class="flex-1 w-full bg-black md:bg-spotify-card md:rounded-xl shadow-2xl overflow-hidden">
                <div id="soundcloud-container" class="w-full h-full">
                    <!-- El iframe se cargará dinámicamente aquí -->
                </div>
            </div>
        </div>

    </main>

    <script>
        function playBook(soundCloudUrl, title) {
            // Cambiar las vistas
            document.getElementById('library-view').classList.add('hidden');
            document.getElementById('player-view').classList.remove('hidden');
            document.getElementById('player-title').innerText = title;
            
            // Calculamos un alto generoso dinámico para celulares (85vh) o 650px fijos.
            // Esto asegura que la carátula y la lista de canciones entren perfectas.
            document.getElementById('soundcloud-container').innerHTML = `
                <iframe width="100%" height="100%" style="min-height: 75vh;" scrolling="no" frameborder="no" allow="autoplay" 
                src="${soundCloudUrl}&color=%231ed760&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=true"
                class="w-full h-full">
                </iframe>
            `;
            
            // Subir al tope de la pantalla
            window.scrollTo(0, 0);
            document.querySelector('main').scrollTo(0, 0);
        }

        function goBack() {
            // Cambiar las vistas de regreso
            document.getElementById('player-view').classList.add('hidden');
            document.getElementById('library-view').classList.remove('hidden');
            
            // Vaciar el contenedor apaga la música al volver
            document.getElementById('soundcloud-container').innerHTML = '';
            
            // Subir al tope de la pantalla
            window.scrollTo(0, 0);
            document.querySelector('main').scrollTo(0, 0);
        }
    </script>
</body>
</html>
